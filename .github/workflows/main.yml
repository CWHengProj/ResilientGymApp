name: Scheduled Ping
# This workflow is triggered at a scheduled interval of every 10 minutes
on:
  schedule:
    # * is a special character in YAML so you have to quote this string.
    # /10 denotes that it will run once every 10 minutes
    - cron:  '*/5 * * * *'

jobs:
  pinger_job:
    name: A job to ping
    runs-on: ubuntu-latest
    env:
      URL: https://resilientbackend.onrender.com/ping
      METHOD: GET  # the method used to make the request. It is GET by default
    steps:
      - id: ping
        uses: sisodiya2421/pinger@master
